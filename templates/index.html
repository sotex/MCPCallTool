<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP 智能控制台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --sidebar-width: 300px; }
        body { background-color: #f4f7f9; display: flex; height: 100vh; overflow: hidden; margin: 0; }
        #app { display: flex; width: 100%; height: 100%; }
        
        /* 1. 可调宽度的侧边栏 */
        .sidebar { 
            min-width: 200px; 
            max-width: 600px;
            height: 100vh; 
            border-right: 1px solid #dee2e6; 
            background: #ffffff; 
            display: flex;
            flex-direction: column;
            position: relative;
            flex-shrink: 0;
        }
        .resizer {
            width: 4px;
            cursor: col-resize;
            position: absolute;
            right: 0; top: 0; bottom: 0;
            z-index: 10;
            transition: background 0.2s;
        }
        .resizer:hover, .resizer:active { background: #0d6efd; }

        .main-content { flex: 1; height: 100vh; overflow-y: auto; padding: 1.5rem; position: relative; }
        
        .tool-list { overflow-y: auto; flex: 1; }
        .tool-item { cursor: pointer; border-radius: 8px; transition: all 0.2s; border: 1px solid transparent; }
        .tool-item:hover { background-color: #f1f3f5; border-color: #dee2e6; }
        .tool-item.active { background-color: #e7f1ff; border-color: #0d6efd; color: #084298; }
        
        /* 2. 手动调整大小的结果组件 */
        .result-container {
            resize: vertical; 
            overflow: auto;
            min-height: 150px;
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-top: none;
            border-radius: 0 0 8px 8px;
        }
        .result-content-wrap { white-space: pre-wrap; word-break: break-all; padding: 15px; font-family: monospace; }
        .result-content-nowrap { white-space: pre; overflow-x: auto; padding: 15px; font-family: monospace; }

        .log-area { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 6px; font-family: 'Consolas', monospace; height: 180px; overflow-y: auto; font-size: 0.85rem; }
        .required-star { color: #dc3545; margin-left: 2px; }
        
        /* 3. Tip 样式 */
        .desc-tip { cursor: help; border-bottom: 1px dashed #999; color: #666; font-size: 0.8rem; }
    </style>
</head>
<body>

{% raw %}
<div id="app">
    <!-- 左侧工具列表 -->
    <div class="sidebar shadow-sm" :style="{ width: sidebarWidth + 'px' }">
        <div class="p-3">
            <h4 class="mb-4 fw-bold text-primary">MCP 控制面板</h4>
            
            <div class="input-group input-group-sm mb-3">
                <input v-model="newUrl" type="text" class="form-control" placeholder="服务 URL (http-stream)">
                <button @click="connectService" class="btn btn-primary">连接</button>
            </div>

            <!-- 1. 过滤功能 -->
            <div class="mb-1">
                <input v-model="filterQuery" type="text" class="form-control form-control-sm" placeholder="搜索名称或描述...">
            </div>
        </div>
        
        <div class="tool-list p-3 pt-0">
            <div v-if="filteredTools.length > 0">
                <h6 class="text-uppercase text-muted small fw-bold mb-3">可用工具 ({{filteredTools.length}})</h6>
                <div v-for="tool in filteredTools" 
                     :key="tool.name" 
                     @click="selectTool(tool)"
                     :class="['p-3 mb-2 tool-item', selectedTool && selectedTool.name === tool.name ? 'active' : '']">
                    <div class="fw-bold">{{ tool.name }}</div>
                    <div class="small text-truncate opacity-75">{{ tool.description }}</div>
                </div>
            </div>
            <div v-else class="text-center py-5 text-muted">
                <small v-if="tools.length > 0">未找到匹配项</small>
                <small v-else>请先连接 MCP 服务</small>
            </div>
        </div>

        <!-- 4. 侧边栏拖拽条 -->
        <div class="resizer" @mousedown="initResize"></div>
    </div>

    <!-- 右侧详情与执行区 -->
    <div class="main-content">
        <div v-if="selectedTool">
            <div class="d-flex justify-content-between align-items-start mb-4">
                <div>
                    <h2 class="fw-bold mb-1">{{ selectedTool.name }}</h2>
                    <p class="text-muted">{{ selectedTool.description }}</p>
                </div>
                <span class="badge bg-secondary">v1.0</span>
            </div>

            <div class="row">
                <!-- 参数输入 -->
                <div class="col-lg-7">
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-header bg-white fw-bold border-bottom-0 pt-3">参数配置</div>
                        <div class="card-body">
                            <div v-for="(prop, name) in selectedTool.inputSchema.properties" :key="name" class="mb-4">
                                <label class="form-label d-flex justify-content-between align-items-center">
                                    <span>
                                        <span class="fw-bold">{{ name }}</span>
                                        <span v-if="isRequired(name)" class="required-star">*</span>
                                        
                                        <!-- 3. 参数描述截断与 Tip -->
                                        <span v-if="prop.description" 
                                              class="ms-2 desc-tip" 
                                              :title="prop.description">
                                            ({{ truncateDesc(prop.description) }})
                                        </span>
                                    </span>
                                    <span class="badge bg-light text-muted small border">{{ prop.type }}</span>
                                </label>
                                
                                <select v-if="prop.enum" v-model="payload[name]" class="form-select">
                                    <option v-for="opt in prop.enum" :value="opt">{{ opt }}</option>
                                </select>

                                <div v-else-if="prop.type === 'boolean'" class="form-check form-switch ms-1">
                                    <input class="form-check-input" type="checkbox" v-model="payload[name]">
                                    <label class="form-check-label text-muted">{{ payload[name] ? 'True' : 'False' }}</label>
                                </div>

                                <input v-else-if="prop.type === 'number' || prop.type === 'integer'" 
                                       type="number" v-model.number="payload[name]" class="form-control">

                                <textarea v-else-if="prop.type === 'string' && (prop.maxLength > 100 || name.includes('content'))" 
                                          v-model="payload[name]" class="form-control" rows="3"></textarea>

                                <input v-else type="text" v-model="payload[name]" class="form-control">
                            </div>

                            <button @click="executeTool" :disabled="isRunning" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                                <span v-if="isRunning" class="spinner-border spinner-border-sm me-2"></span>
                                {{ isRunning ? '正在执行...' : '立即执行工具' }}
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 状态与结果 -->
                <div class="col-lg-5">
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-header bg-dark text-white py-2 small">实时日志</div>
                        <div class="log-area" id="logBox">
                            <div v-for="(log, index) in progressLogs" :key="index" class="mb-1">
                                <span class="text-secondary">[{{ index + 1 }}]</span> {{ log }}
                            </div>
                        </div>
                    </div>

                    <!-- 2. 返回结果组件 (可调大小 & 自动换行) -->
                    <div v-if="finalResult" class="card shadow-sm border-0 border-top border-success border-4">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center">
                            <span class="fw-bold text-success">执行结果</span>
                            <div class="form-check form-switch m-0">
                                <input class="form-check-input" type="checkbox" v-model="isAutoWrap" id="wrapSwitch">
                                <label class="form-check-label small" for="wrapSwitch">自动换行</label>
                            </div>
                        </div>
                        <div class="result-container">
                            <div :class="isAutoWrap ? 'result-content-wrap' : 'result-content-nowrap'">
                                <div v-for="(content, index) in finalResult" :key="index" class="mb-3">
                                    <template v-if="content.type === 'text'">
                                        <div class="text-muted small mb-1">Text Content:</div>
                                        <div class="p-2 bg-light border rounded">{{ content.text }}</div>
                                    </template>
                                    <template v-if="content.type === 'image'">
                                        <div class="text-muted small mb-1">Image Result:</div>
                                        <img :src="'data:image/png;base64,' + content.data" class="img-fluid rounded shadow-sm">
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div v-else class="h-100 d-flex align-items-center justify-content-center text-center">
            <div class="opacity-50">
                <h3 class="text-muted">等待连接</h3>
                <p>从左侧面板连接并选择一个工具</p>
            </div>
        </div>
    </div>
</div>
{% endraw %}

<script>
    const socket = io();

    new Vue({
        el: '#app',
        data: {
            newUrl: '',
            currentUrl: '',
            tools: [],
            filterQuery: '',
            selectedTool: null,
            payload: {},
            isRunning: false,
            progressLogs: [],
            finalResult: null,
            isAutoWrap: true,
            sidebarWidth: 300 
        },
        computed: {
            filteredTools() {
                const q = this.filterQuery.toLowerCase();
                return this.tools.filter(t => 
                    t.name.toLowerCase().includes(q) || 
                    (t.description && t.description.toLowerCase().includes(q))
                );
            }
        },
        methods: {
            truncateDesc(text) {
                if (!text) return '';
                return text.length > 64 ? text.substring(0, 64) + '...' : text;
            },
            initResize(e) {
                e.preventDefault();
                document.addEventListener('mousemove', this.startResizing);
                document.addEventListener('mouseup', this.stopResizing);
            },
            startResizing(e) {
                if (e.clientX >= 200 && e.clientX <= 600) {
                    this.sidebarWidth = e.clientX;
                }
            },
            stopResizing() {
                document.removeEventListener('mousemove', this.startResizing);
                document.removeEventListener('mouseup', this.stopResizing);
            },
            connectService() {
                if(!this.newUrl) return alert("请输入URL");
                fetch('/add_service', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url: this.newUrl.trim() })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') {
                        this.tools = data.tools;
                        this.currentUrl = data.url;
                    } else { alert('错误: ' + data.message); }
                })
                .catch(err => alert('请求失败: ' + err));
            },
            selectTool(tool) {
                this.selectedTool = tool;
                this.finalResult = null;
                this.progressLogs = [];
                const newPayload = {};
                const props = tool.inputSchema.properties || {};
                Object.keys(props).forEach(key => {
                    if (props[key].default !== undefined) {
                        newPayload[key] = props[key].default;
                    } else if (props[key].type === 'boolean') {
                        newPayload[key] = false;
                    } else {
                        newPayload[key] = "";
                    }
                });
                this.payload = newPayload;
            },
            isRequired(name) {
                return this.selectedTool.inputSchema.required && 
                       this.selectedTool.inputSchema.required.includes(name);
            },
            executeTool() {
                this.isRunning = true;
                this.finalResult = null;
                this.progressLogs = ["准备发送指令..."];
                socket.emit('execute_tool', {
                    url: this.currentUrl,
                    tool_name: this.selectedTool.name,
                    arguments: this.payload
                });
            }
        },
        mounted() {
            socket.on('tool_progress', (data) => {
                this.progressLogs.push(data.data);
                this.$nextTick(() => {
                    const b = document.getElementById('logBox');
                    if(b) b.scrollTop = b.scrollHeight;
                });
            });
            socket.on('tool_result', (data) => {
                this.isRunning = false;
                this.finalResult = data.content;
                this.progressLogs.push("执行完成。");
            });
            socket.on('error', (data) => {
                this.isRunning = false;
                this.progressLogs.push("异常: " + data.message);
                alert('MCP 错误: ' + data.message);
            });
        }
    });
</script>
</body>
</html>
